seed: 42

paths:
  raw_dir: ipl_json
  processed_dir: data/processed
  checkpoint: checkpoints/model.pt   # legacy single-model path; `register` imports it
  experiments_dir: experiments

split:
  # stratified_year: random split by match within each year, so every season appears in
  #   train/val/test in the same proportions.
  # chronological: train <= train_until, validate on val_year, test on later years.
  mode: stratified_year
  val_frac: 0.1
  test_frac: 0.1
  seed: 42            # split seed (separate from the training seed)
  # train_until: 2023   # chronological mode only
  # val_year: 2024

model:
  embed_dim: 8
  hidden_dims: [128, 64, 32]
  dropout: 0.1

train:
  batch_size: 512
  epochs: 60
  lr: 0.001
  weight_decay: 0.0001
  patience: 8
  huber_delta: 0.2   # in units of target_scale runs
  target_scale: 100.0
