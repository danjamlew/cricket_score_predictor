[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-predictor"
version = "0.1.0"
description = "Neural network framework for predicting the final score of an IPL innings"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "pandas>=2.2", "pyyaml>=6.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
